# Muditor NEXT reverse proxy (port 80 only).
#
# Install: setup-root.sh prepare copies this to /etc/apache2/sites-available/05-muditor.conf
# and runs a2ensite. Once DNS resolves, `certbot --apache` (setup-root.sh certs) copies
# these vhosts into /etc/apache2/sites-available/05-muditor-le-ssl.conf (port 443) and adds
# the certificate lines + an http->https redirect. Do NOT hand-write the SSL vhost: certbot
# generates 05-muditor-le-ssl.conf; edit that file if the 443 variant needs tweaks.
#
# Requires: proxy proxy_http proxy_wstunnel headers rewrite ssl.
#
# In the SSL copy (05-muditor-le-ssl.conf) add inside each proxied <VirtualHost *:443>:
#     RequestHeader set X-Forwarded-Proto "https"
# (kept out of the port-80 vhosts on purpose: plain http must not claim to be https).

<VirtualHost *:80>
    ServerName muditor.fierymud.org
    ServerAdmin webmaster@fierymud.org
    ErrorLog ${APACHE_LOG_DIR}/muditor-error.log
    CustomLog ${APACHE_LOG_DIR}/muditor-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 120
    # Let certbot HTTP-01 challenges through to the filesystem (must precede ProxyPass /)
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

<VirtualHost *:80>
    ServerName muditor-api.fierymud.org
    ServerAdmin webmaster@fierymud.org
    ErrorLog ${APACHE_LOG_DIR}/muditor-api-error.log
    CustomLog ${APACHE_LOG_DIR}/muditor-api-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 120

    # GraphQL subscriptions: upgrade websocket requests to ws://
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(graphql.*)$ ws://127.0.0.1:3001/$1 [P,L]

    # Let certbot HTTP-01 challenges through to the filesystem (must precede ProxyPass /)
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
