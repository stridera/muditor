# Command in-game help (summary/text) operations

query GetCommandHelp {
  commands {
    name
    aliases
    category
    helpSummary
    helpText
    allowedWhileCasting
    allowedWhileParalyzed
    keepsHidden
    heldByCastLag
    updatedAt
  }
}

mutation UpdateCommandHelp(
  $name: String!
  $helpSummary: String
  $helpText: String
) {
  updateCommandHelp(
    name: $name
    helpSummary: $helpSummary
    helpText: $helpText
  ) {
    name
    helpSummary
    helpText
    updatedAt
  }
}

mutation UpdateCommandFlags(
  $name: String!
  $allowedWhileCasting: Boolean
  $allowedWhileParalyzed: Boolean
  $keepsHidden: Boolean
  $heldByCastLag: Boolean
) {
  updateCommandFlags(
    name: $name
    allowedWhileCasting: $allowedWhileCasting
    allowedWhileParalyzed: $allowedWhileParalyzed
    keepsHidden: $keepsHidden
    heldByCastLag: $heldByCastLag
  ) {
    name
    allowedWhileCasting
    allowedWhileParalyzed
    keepsHidden
    heldByCastLag
    updatedAt
  }
}
