# Command in-game help (summary/text) operations

# Paged on the server: commandsCount is the total for the same search.
query GetCommandHelp($search: String, $skip: Int, $take: Int) {
  commands(search: $search, skip: $skip, take: $take) {
    name
    aliases
    category
    helpSummary
    helpText
    allowedWhileCasting
    allowedWhileParalyzed
    keepsHidden
    heldByCastLag
    updatedAt
  }
  commandsCount(search: $search)
}

mutation UpdateCommandHelp(
  $name: String!
  $helpSummary: String
  $helpText: String
) {
  updateCommandHelp(
    name: $name
    helpSummary: $helpSummary
    helpText: $helpText
  ) {
    name
    helpSummary
    helpText
    updatedAt
  }
}

mutation UpdateCommandFlags(
  $name: String!
  $allowedWhileCasting: Boolean
  $allowedWhileParalyzed: Boolean
  $keepsHidden: Boolean
  $heldByCastLag: Boolean
) {
  updateCommandFlags(
    name: $name
    allowedWhileCasting: $allowedWhileCasting
    allowedWhileParalyzed: $allowedWhileParalyzed
    keepsHidden: $keepsHidden
    heldByCastLag: $heldByCastLag
  ) {
    name
    allowedWhileCasting
    allowedWhileParalyzed
    keepsHidden
    heldByCastLag
    updatedAt
  }
}
