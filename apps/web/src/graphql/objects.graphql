# Object related operations (unified) with fragments

fragment ObjectSummary on ObjectDto {
  id
  name
  type
  level
  weight
  cost
  zoneId
  keywords
  values
}

fragment ObjectDetails on ObjectDto {
  ...ObjectSummary
  examineDescription
  roomDescription
  actionDescription
  concealment
  timer
  decomposeTimer
  flags
  wearFlags
  restrictions
  restrictedClassIds
  restrictedAlignments
  restrictedRaces
  allowedRaces
  minSize
  maxSize
  passengerCapacity
  presenceOverride
  grantedEffects {
    id
    effectId
    strength
    modifierData
    wearLocation
    effect {
      id
      name
      effectType
    }
  }
  objectResistances {
    id
    element
    value
    allowAbsorption
  }
  consumableEffects {
    id
    effectId
    chance
    level
    duration
    effect {
      id
      name
      effectType
    }
  }
  createdAt
  updatedAt
}

# Objects list page: search, zone, type/level/cost/weight filters, sort and
# paging all run on the server; objectsCount is the total for the same filter.
query ObjectsPage(
  $zoneId: Int
  $search: String
  $types: [ObjectType!]
  $levelMin: Int
  $levelMax: Int
  $costMin: Int
  $weightMin: Int
  $weightMax: Int
  $sortBy: String
  $sortDir: String
  $skip: Int
  $take: Int
) {
  objects(
    zoneId: $zoneId
    search: $search
    types: $types
    levelMin: $levelMin
    levelMax: $levelMax
    costMin: $costMin
    weightMin: $weightMin
    weightMax: $weightMax
    sortBy: $sortBy
    sortDir: $sortDir
    skip: $skip
    take: $take
  ) {
    ...ObjectSummary
  }
  objectsCount(
    zoneId: $zoneId
    search: $search
    types: $types
    levelMin: $levelMin
    levelMax: $levelMax
    costMin: $costMin
    weightMin: $weightMin
    weightMax: $weightMax
  )
}

query GetObject($id: Int!, $zoneId: Int!) {
  object(id: $id, zoneId: $zoneId) {
    ...ObjectDetails
  }
}

query SearchObjects($search: String!, $limit: Int, $zoneId: Int) {
  searchObjects(search: $search, limit: $limit, zoneId: $zoneId) {
    id
    zoneId
    name
    plainName
    type
    level
  }
}

mutation CreateObject($data: CreateObjectInput!) {
  createObject(data: $data) {
    ...ObjectSummary
  }
}

mutation UpdateObject($id: Int!, $zoneId: Int!, $data: UpdateObjectInput!) {
  updateObject(id: $id, zoneId: $zoneId, data: $data) {
    ...ObjectSummary
  }
}

mutation DeleteObject($id: Int!, $zoneId: Int!) {
  deleteObject(id: $id, zoneId: $zoneId) {
    zoneId
    id
  }
}

mutation DeleteObjects($keys: [EntityKeyInput!]!) {
  deleteObjects(keys: $keys)
}

mutation UpdateObjectEffects(
  $zoneId: Int!
  $id: Int!
  $effects: [ObjectEffectInput!]!
) {
  updateObjectEffects(zoneId: $zoneId, id: $id, effects: $effects) {
    ...ObjectSummary
  }
}

mutation UpdateObjectResistances(
  $zoneId: Int!
  $id: Int!
  $resistances: [ObjectResistanceInput!]!
) {
  updateObjectResistances(zoneId: $zoneId, id: $id, resistances: $resistances) {
    ...ObjectSummary
  }
}

mutation UpdateConsumableEffects(
  $zoneId: Int!
  $id: Int!
  $effects: [ConsumableEffectInput!]!
) {
  updateConsumableEffects(zoneId: $zoneId, id: $id, effects: $effects) {
    ...ObjectSummary
  }
}
