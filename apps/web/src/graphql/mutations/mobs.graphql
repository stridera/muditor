mutation UpdateMob($zoneId: Int!, $id: Int!, $data: UpdateMobInput!) {
  updateMob(zoneId: $zoneId, id: $id, data: $data) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    alignment
    hitRoll
    armorClass
    hpDice
    damageDice
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    perception
    concealment
    race
    gender
    size
    lifeForce
    composition
    traits
    behaviors
    professions
    aggressionFormula
    activityRestrictions
    riderPresenceMessage
    position
    defaultPosition
    movementMode
    defaultMovementMode
    stance
  }
}

mutation CreateMob($data: CreateMobInput!) {
  createMob(data: $data) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    alignment
    hitRoll
    armorClass
    hpDice
    damageDice
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    perception
    concealment
    race
    gender
    size
    lifeForce
    composition
    traits
    behaviors
    professions
    aggressionFormula
    activityRestrictions
    riderPresenceMessage
    position
    defaultPosition
    movementMode
    defaultMovementMode
    stance
  }
}

mutation DeleteMob($zoneId: Int!, $id: Int!) {
  deleteMob(zoneId: $zoneId, id: $id) {
    id
    zoneId
  }
}

mutation UpdateMobDefaultEffects($zoneId: Int!, $id: Int!, $effects: [MobDefaultEffectInput!]!) {
  updateMobDefaultEffects(zoneId: $zoneId, id: $id, effects: $effects) {
    id
    zoneId
    defaultEffects {
      id
      effectId
      strength
      modifierData
      effect {
        id
        name
        effectType
      }
    }
  }
}
