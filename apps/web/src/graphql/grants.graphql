# Zone grant administration (HEAD_BUILDER+ UI)

query GrantsAdminUsers {
  users: grantableUsers {
    id
    displayName
    role
  }
}

query GrantsAdminZoneGrants {
  grants(resourceType: ZONE) {
    id
    userId
    resourceId
    permissions
    displayName
    grantedByDisplayName
    grantedAt
    expiresAt
    notes
  }
}

mutation CreateZoneGrant($data: CreateGrantInput!) {
  createGrant(data: $data) {
    id
    userId
    resourceId
    permissions
  }
}

mutation DeleteZoneGrant($id: ID!) {
  deleteGrant(id: $id)
}
