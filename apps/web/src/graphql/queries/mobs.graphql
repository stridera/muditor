query GetMob($id: Int!, $zoneId: Int!) {
  mob(id: $id, zoneId: $zoneId) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    role
    alignment
    accuracy
    attackPower
    spellPower
    penetrationFlat
    penetrationPercent
    evasion
    armorRating
    damageReductionPercent
    soak
    hardness
    wardPercent
    resistanceFire
    resistanceCold
    resistanceLightning
    resistanceAcid
    resistancePoison
    hpDice
    damageDice
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    perception
    concealment
    wealth
    race
    gender
    size
    lifeForce
    composition
    traits
    behaviors
    professions
    aggressionFormula
    activityRestrictions
    riderPresenceMessage
    defaultPosition
    movementMode
    defaultMovementMode
    defaultEffects {
      id
      effectId
      strength
      modifierData
      effect {
        id
        name
        effectType
      }
    }
    createdAt
    updatedAt
  }
}

query GetMobs($skip: Int, $take: Int) {
  mobs(skip: $skip, take: $take) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    alignment
    race
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    lifeForce
    hpDice
    damageDice
    traits
    behaviors
    professions
  }
}

query GetMobsByZone($zoneId: Int!) {
  mobsByZone(zoneId: $zoneId) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    alignment
    race
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    wealth
    hpDice
    damageDice
    traits
    behaviors
    professions
    lifeForce
  }
}

query SearchMobs($search: String!, $limit: Int, $zoneId: Int) {
  searchMobs(search: $search, limit: $limit, zoneId: $zoneId) {
    id
    zoneId
    name
    plainName
    roomDescription
    level
    race
  }
}
