query GetMob($id: Int!, $zoneId: Int!) {
  mob(id: $id, zoneId: $zoneId) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    role
    aiMode
    classId
    alignment
    accuracy
    attackPower
    spellPower
    penetrationFlat
    penetrationPercent
    evasion
    armorRating
    damageReductionPercent
    soak
    hardness
    wardPercent
    resistanceFire
    resistanceCold
    resistanceLightning
    resistanceAcid
    resistancePoison
    hpDice
    damageDice
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    perception
    concealment
    wealth
    race
    gender
    size
    lifeForce
    composition
    traits
    behaviors
    professions
    aggressionFormula
    activityRestrictions
    riderPresenceMessage
    defaultPosition
    movementMode
    defaultMovementMode
    defaultEffects {
      id
      effectId
      strength
      modifierData
      effect {
        id
        name
        effectType
      }
    }
    createdAt
    updatedAt
  }
}

# Mobs list page: search, zone, level range, sort and paging all run on the
# server; mobsCount is the total across every page of the same filter.
query MobsPage(
  $zoneId: Int
  $search: String
  $levelMin: Int
  $levelMax: Int
  $aggressive: Boolean
  $sortBy: String
  $sortDir: String
  $skip: Int
  $take: Int
) {
  mobs(
    zoneId: $zoneId
    search: $search
    levelMin: $levelMin
    levelMax: $levelMax
    aggressive: $aggressive
    sortBy: $sortBy
    sortDir: $sortDir
    skip: $skip
    take: $take
  ) {
    id
    zoneId
    keywords
    name
    roomDescription
    examineDescription
    level
    alignment
    race
    damageType
    strength
    intelligence
    wisdom
    dexterity
    constitution
    charisma
    wealth
    hpDice
    damageDice
    traits
    behaviors
    professions
    lifeForce
  }
  mobsCount(
    zoneId: $zoneId
    search: $search
    levelMin: $levelMin
    levelMax: $levelMax
    aggressive: $aggressive
  )
}

query SearchMobs($search: String!, $limit: Int, $zoneId: Int) {
  searchMobs(search: $search, limit: $limit, zoneId: $zoneId) {
    id
    zoneId
    name
    plainName
    roomDescription
    level
    race
  }
}

query NextMobId($zoneId: Int!) {
  nextMobId(zoneId: $zoneId)
}
