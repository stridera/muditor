query GetQuests($filter: QuestFilterInput, $skip: Int, $take: Int) {
  quests(filter: $filter, skip: $skip, take: $take) {
    zoneId
    id
    name
    description
    minLevel
    maxLevel
    repeatable
    hidden
    exclusiveGroup
    triggerType
    triggerMobZoneId
    triggerMobId
    triggerLevel
    timeLimitMinutes
    createdAt
    updatedAt
    phases {
      id
      name
      description
      order
      objectives {
        id
        objectiveType
        playerDescription
        requiredCount
        showProgress
      }
      rewards {
        id
        rewardType
        amount
        objectZoneId
        objectId
        abilityId
      }
    }
    prerequisites {
      id
      prerequisiteQuestZoneId
      prerequisiteQuestId
    }
  }
}

query GetQuestsByZone($zoneId: Int!) {
  questsByZone(zoneId: $zoneId) {
    zoneId
    id
    name
    description
    minLevel
    maxLevel
    repeatable
    hidden
    createdAt
    updatedAt
    phases {
      id
      name
      order
      objectives {
        id
        objectiveType
        playerDescription
        requiredCount
      }
      rewards {
        id
        rewardType
        amount
      }
    }
  }
}

query GetQuest($zoneId: Int!, $id: Int!) {
  quest(zoneId: $zoneId, id: $id) {
    zoneId
    id
    name
    description
    shortDescription
    minLevel
    maxLevel
    repeatable
    hidden
    autoAccept
    shareable
    cooldownMinutes
    exclusiveGroup
    triggerType
    triggerMobZoneId
    triggerMobId
    triggerLevel
    triggerItemZoneId
    triggerItemId
    triggerRoomZoneId
    triggerRoomId
    triggerAbilityId
    triggerEventId
    timeLimitMinutes
    availabilityRequirement
    createdAt
    updatedAt
    phases {
      id
      questZoneId
      questId
      name
      description
      order
      objectives {
        id
        questZoneId
        questId
        phaseId
        objectiveType
        scope
        playerDescription
        internalNote
        showProgress
        requiredCount
        targetMobZoneId
        targetMobId
        targetObjectZoneId
        targetObjectId
        targetRoomZoneId
        targetRoomId
        targetAbilityId
        deliverToMobZoneId
        deliverToMobId
        luaExpression
        dialogue {
          id
          npcMessage
          matchType
          matchKeywords
          dialogueTreeId
        }
      }
      rewards {
        id
        questZoneId
        questId
        phaseId
        rewardType
        amount
        objectZoneId
        objectId
        abilityId
        choiceGroup
        quantity
        condition
      }
    }
    prerequisites {
      id
      questZoneId
      questId
      prerequisiteQuestZoneId
      prerequisiteQuestId
      requireCompletion
    }
  }
}

query GetQuestsCount($zoneId: Int) {
  questsCount(zoneId: $zoneId)
}

mutation CreateQuest($data: CreateQuestInput!) {
  createQuest(data: $data) {
    zoneId
    id
    name
    description
    shortDescription
    minLevel
    maxLevel
    repeatable
    hidden
    autoAccept
    shareable
    cooldownMinutes
    exclusiveGroup
    triggerType
    triggerMobZoneId
    triggerMobId
    triggerLevel
    triggerItemZoneId
    triggerItemId
    triggerRoomZoneId
    triggerRoomId
    triggerAbilityId
    triggerEventId
    timeLimitMinutes
    availabilityRequirement
  }
}

mutation UpdateQuest($zoneId: Int!, $id: Int!, $data: UpdateQuestInput!) {
  updateQuest(zoneId: $zoneId, id: $id, data: $data) {
    zoneId
    id
    name
    description
    shortDescription
    minLevel
    maxLevel
    repeatable
    hidden
    autoAccept
    shareable
    cooldownMinutes
    exclusiveGroup
    triggerType
    triggerMobZoneId
    triggerMobId
    triggerLevel
    triggerItemZoneId
    triggerItemId
    triggerRoomZoneId
    triggerRoomId
    triggerAbilityId
    triggerEventId
    timeLimitMinutes
    availabilityRequirement
  }
}

mutation DeleteQuest($zoneId: Int!, $id: Int!) {
  deleteQuest(zoneId: $zoneId, id: $id) {
    zoneId
    id
  }
}

mutation CreateQuestPhase($data: CreateQuestPhaseInput!) {
  createQuestPhase(data: $data) {
    id
    questZoneId
    questId
    name
    description
    order
    rewards {
      id
      rewardType
      amount
    }
  }
}

mutation UpdateQuestPhase(
  $questZoneId: Int!
  $questId: Int!
  $id: Int!
  $data: UpdateQuestPhaseInput!
) {
  updateQuestPhase(
    questZoneId: $questZoneId
    questId: $questId
    id: $id
    data: $data
  ) {
    id
    questZoneId
    questId
    name
    description
    order
    rewards {
      id
      rewardType
      amount
    }
  }
}

mutation ReorderQuestPhases(
  $questZoneId: Int!
  $questId: Int!
  $phaseIds: [Int!]!
) {
  reorderQuestPhases(
    questZoneId: $questZoneId
    questId: $questId
    phaseIds: $phaseIds
  ) {
    id
    order
  }
}

mutation DeleteQuestPhase($questZoneId: Int!, $questId: Int!, $id: Int!) {
  deleteQuestPhase(questZoneId: $questZoneId, questId: $questId, id: $id) {
    id
  }
}

mutation CreateQuestObjective($data: CreateQuestObjectiveInput!) {
