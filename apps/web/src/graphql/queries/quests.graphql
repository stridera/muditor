    requireCompletion
  }
}

mutation DeleteQuestPrerequisite($id: Int!) {
  deleteQuestPrerequisite(id: $id) {
    id
  }
}

# Lightweight list for the prerequisite picker.
query GetQuestOptions {
  quests {
    zoneId
    id
    name
  }
}

# Ability pickers (USE_SKILL objective, ABILITY reward, SKILL trigger).
query GetAbilityOptions($search: String, $take: Int) {
  abilities(search: $search, take: $take) {
    id
    name
    abilityType
  }
}

query GetAbilityName($id: ID!) {
  ability(id: $id) {
    id
    name
  }
}
